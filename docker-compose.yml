services:
  deco-rate:
    build:
      context: https://github.com/SimonJPegg/deco-rate.git#819ca53a4b91a18f3b609346711797d2f4c2f5a9
    image: deco-rate:x50
    container_name: deco-rate
    restart: unless-stopped
    volumes:
      - ./config.yaml:/etc/deco-rate/config.yaml:ro
      - ./overrides/deco_rate/client.py:/app/.venv/lib/python3.12/site-packages/deco_rate/client.py:ro
      - ./overrides/deco_rate/main.py:/app/.venv/lib/python3.12/site-packages/deco_rate/main.py:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - homelab

networks:
  default:
    name: deco-x50
  homelab:
    external: true
    name: homelab