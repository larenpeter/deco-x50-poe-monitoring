services:
  deco-rate:
    build:
      context: .
    image: deco-rate:x50
    container_name: deco-rate
    restart: unless-stopped
    volumes:
      - ./config.yaml:/etc/deco-rate/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - homelab

networks:
  default:
    name: deco-x50
  homelab:
    external: true
    name: homelab