services:
  deco-rate:
    build:
      context: https://github.com/SimonJPegg/deco-rate.git#819ca53a4b91a18f3b609346711797d2f4c2f5a9
    image: deco-rate:x50
    container_name: deco-rate
    restart: unless-stopped
    volumes:
      - ./config.yaml:/etc/deco-rate/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

volumes:
  prometheus-data:

networks:
  default:
    name: deco-x50
